# --------------------------------------------------------
# PointTTT: ModelNet40 Classification (XYZ-only)
# Input: 8000 points, XYZ coordinates only
# Octree feature: P (3 channels)
# No normal or local displacement input features
# --------------------------------------------------------

SOLVER:
  gpu: 0,
  run: train
  type: adamw
  best_val: max:accu
  logdir: logs/modelnet40/xyz_only
  rand_seed: 42

  max_epoch: 300
  test_every_epoch: 5
  log_per_iter: 20

  lr: 0.0001
  lr_type: step
  weight_decay: 0.05
  milestones: (120,160)
  ckpt_num: 5

DATA:
  train:
    name: modelnet40

    # Octree construction
    depth: 6
    full_depth: 2

    # Data augmentation
    orient_normal: xyz
    distort: True
    angle: (0, 0, 5)
    interval: (1, 1, 1)
    scale: 0.25
    uniform: False
    jitter: 0.125
    flip: (0.0, 0.0, 0.0)

    # Data loading
    location: data/ModelNet40/ModelNet40.ply.normalize
    filelist: data/ModelNet40/filelist/m40_train.txt
    batch_size: 32
    shuffle: True
    pin_memory: False
    num_workers: 4

  test:
    name: modelnet40

    # Octree construction
    depth: 6
    full_depth: 2

    # No test-time augmentation
    orient_normal: xyz
    distort: False
    angle: (0, 0, 5)
    interval: (1, 1, 1)
    scale: 0.25
    uniform: False
    jitter: 0.125
    flip: (0.0, 0.0, 0.0)

    # Data loading
    location: data/ModelNet40/ModelNet40.ply.normalize
    filelist: data/ModelNet40/filelist/m40_test.txt
    batch_size: 16
    shuffle: False
    pin_memory: False
    num_workers: 2

MODEL:
  name: pointttt_cls
  nout: 40

  # XYZ-only octree input features
  channel: 3
  nempty: False
  feature: P

  # PointTTT configuration
  ttt_base_lr: 1.0
  ttt_update_train: True
  ttt_update_test: True

LOSS:
  num_class: 40
