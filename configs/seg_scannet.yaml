# ScanNet-20 semantic segmentation from scratch.
# Protocol: OctFormer official ScanNet configuration, except that the learning
# rate remains 1e-4 as requested. The validation split is used for checkpoint
# selection; scripts/run_seg_scannet.py switches to the official test split for
# final 72-vote test inference.

SOLVER:
  gpu: 0,1,
  run: train
  logdir: logs/scannet/from_scratch_1cm
  best_val: max:mIoU_part

  ckpt_num: 200
  max_epoch: 800
  test_every_epoch: 1
  log_per_iter: 10

  weight_decay: 0.05
  type: adamw_attn

  # Intentionally kept unchanged; OctFormer's official value is 1.5e-3.
  lr: 0.001
  lr_type: step_warmup
  milestones: (360, 520)
  dist_url: tcp://localhost:10001

DATA:
  train:
    name: scannet

    # OctFormer 1 cm octree protocol.
    depth: 11
    full_depth: 2

    distort: True
    angle: (5, 5, 180)
    scale: 0.2
    jitter: 0.1
    flip: (0.5, 0.5, 0.0)
    uniform: False
    cutmix: 0.0
    crop_ratio: 0.8
    max_npt: 120000

    # Official ScanNet train split: 1201 scenes.
    location: data/scannet.npz/train
    filelist: data/scannet.npz/scannetv2_train_npz.txt
    # OctFormer's per-GPU batch size is 4; two GPUs give global batch size 8.
    batch_size: 4
    shuffle: True
    num_workers: 4

  test:
    name: scannet

    depth: 11
    full_depth: 2

    # Periodic checkpoint selection uses a deterministic single-pass
    # validation. The official multi-vote validation/test modes enable
    # distortion explicitly in scripts/run_seg_scannet.py.
    distort: False
    angle: (5, 5, 180)
    scale: 0.2
    jitter: 0.1
    flip: (0.5, 0.5, 0.0)
    uniform: False
    cutmix: 0.0
    crop_ratio: 0.8
    max_npt: -1

    # Official ScanNet validation split: 312 scenes.
    location: data/scannet.npz/train
    filelist: data/scannet.npz/scannetv2_val_npz.txt
    batch_size: 1
    shuffle: False
    num_workers: 2

MODEL:
  name: pointmamba_seg
  # PointMambaSeg_base in builder.py uses channels [96, 192, 384, 384]
  # and num_blocks [2, 2, 18, 2], matching the OctFormer base hierarchy.
  # N: normal (3), D: displacement (1), F: color (3), P: position (3).
  feature: NDFP
  channel: 10
  nout: 21
  nempty: True
  interp: nearest
  sync_bn: True
  find_unused_parameters: False

LOSS:
  # Label 0 is the unlabeled/background class and is ignored for ScanNet-20.
  mask: 0
  num_class: 21
