SOLVER:
  gpu: 0,
  run: train
  type: adamw
  best_val: max:accu
  logdir: logs/shapenet55/supervised_1024
  max_epoch: 300
  test_every_epoch: 1
  log_per_iter: 20
  lr: 0.0001
  lr_type: step
  weight_decay: 0.05
  milestones: (120,160)
  ckpt_num: 20

DATA:
  train:
    name: shapenet55
    split: train
    point_root: data/ShapeNet55-34/shapenet_pc
    filelist: data/ShapeNet55-34/ShapeNet-55/train.txt
    num_classes: 55
    # Match Point-BERT's ShapeNet55 loader: randomly sample 1024 of 8192
    # points, then normalize the sampled cloud into one unit sphere.
    num_points: 1024
    sampling: random
    normalize: True
    depth: 6
    full_depth: 2
    orient_normal: ''
    distort: True
    angle: (0, 0, 0)
    interval: (1, 1, 1)
    scale: 0.25
    uniform: False
    jitter: 0.1
    flip: (0.0, 0.0, 0.0)
    batch_size: 32
    shuffle: True
    pin_memory: False
    num_workers: 4

  test:
    name: shapenet55
    split: test
    point_root: data/ShapeNet55-34/shapenet_pc
    filelist: data/ShapeNet55-34/ShapeNet-55/test.txt
    num_classes: 55
    num_points: 1024
    sampling: random
    normalize: True
    depth: 6
    full_depth: 2
    orient_normal: ''
    distort: False
    angle: (0, 0, 0)
    interval: (1, 1, 1)
    scale: 0.0
    uniform: False
    jitter: 0.0
    flip: (0.0, 0.0, 0.0)
    batch_size: 32
    shuffle: False
    pin_memory: False
    num_workers: 2

MODEL:
  name: pointmamba_cls
  nout: 55
  channel: 3
  nempty: True
  feature: P

LOSS:
  num_class: 55
