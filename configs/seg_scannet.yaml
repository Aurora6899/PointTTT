
SOLVER:
  gpu: 0,1,2,3,
  run: train
  logdir: logs/scannet/hierarchical_pointttt_1cm_phase2
  best_val: max:mIoU_part

  ckpt_num: 200
  max_epoch: 800
  test_every_epoch: 1
  log_per_iter: 10

  weight_decay: 0.05
  type: adamw_attn

  # Intentionally kept unchanged; OctFormer's official value is 1.5e-3.
  lr: 0.0001
  lr_type: step_warmup
  milestones: (360, 520)
  dist_url: tcp://localhost:10001

DATA:
  train:
    name: scannet

    # OctFormer 1 cm octree protocol.
    depth: 11
    full_depth: 2

    distort: True
    angle: (5, 5, 180)
    scale: 0.2
    jitter: 0.1
    flip: (0.5, 0.5, 0.0)
    uniform: False
    cutmix: 0.0
    crop_ratio: 0.8
    max_npt: 120000

    # Official ScanNet train split: 1201 scenes.
    location: data/scannet.npz/train
    filelist: data/scannet.npz/scannetv2_train_npz.txt
    # OctFormer's per-GPU batch size is 4; two GPUs give global batch size 8.
    batch_size: 4
    shuffle: True
    num_workers: 4

  test:
    name: scannet

    depth: 11
    full_depth: 2

    # Periodic checkpoint selection uses a deterministic single-pass
    # validation. The official multi-vote validation/test modes enable
    # distortion explicitly in scripts/run_seg_scannet.py.
    distort: False
    angle: (5, 5, 180)
    scale: 0.2
    jitter: 0.1
    flip: (0.5, 0.5, 0.0)
    uniform: False
    cutmix: 0.0
    crop_ratio: 0.8
    max_npt: -1

    # Official ScanNet validation split: 312 scenes.
    location: data/scannet.npz/train
    filelist: data/scannet.npz/scannetv2_val_npz.txt
    batch_size: 1
    shuffle: False
    num_workers: 2

MODEL:
  name: pointttt_seg
  # point_ttt_seg_base in builder.py uses channels [96, 192, 384, 384]
  # and num_blocks [2, 2, 18, 2], matching the OctFormer base hierarchy.
  # N: normal (3), D: displacement (1), F: color (3), P: position (3).
  feature: NDFP
  channel: 10
  nout: 21
  nempty: True
  interp: nearest
  sync_bn: True
  find_unused_parameters: False

  # Hierarchical PointTTT / Geo-TNT. Stage ids are zero-based. The default
  # phase uses one global-memory block at the end of stages 2 and 3.
  partition_by_batch: True
  ttt_layer_type: linear
  ttt_patch_size: 64
  ttt_num_heads: 24
  pointttt_hierarchical_enabled: True
  pointttt_hierarchical_stages: [2, 3]
  pointttt_hierarchical_block_interval: 0
  pointttt_global_chunk_size: 128
  pointttt_summary_tokens: 1
  pointttt_global_bidirectional: True
  pointttt_global_gate_init: 0.0

LOSS:
  # Label 0 is the unlabeled/background class and is ignored for ScanNet-20.
  mask: 0
  num_class: 21
