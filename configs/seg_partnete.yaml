# PartNetE few-shot part segmentation from scratch.
# The split, transforms, 148 labels, loss, schedule, metric and final 10-vote
# test follow Pointcept v1.7's Utonia PartNetE fine-tuning protocol.

SOLVER:
  gpu: 0,1,
  run: train
  logdir: logs/partnete/from_scratch_1cm
  best_val: max:mIoU_part
  final_test_best: True

  type: adamw_attn
  weight_decay: 0.02
  # thsolver multiplies this value by world_size. On two GPUs the base group
  # therefore uses 0.002 and PointMamba blocks use the official 0.1x rate.
  lr: 0.001
  lr_type: onecycle
  pct_start: 0.05
  div_factor: 10.0
  final_div_factor: 1000.0

  # A complete object can contain up to 102,400 sampled points. Batch 1 is the
  # safe setting for each 24 GB GPU; 1 x 2 x 32 preserves global batch 64.
  accumulation_steps: 32
  max_epoch: 800
  test_every_epoch: 10
  # Recovery is independent of validation. Re-running this command resumes
  # from the newest completed epoch-boundary solver checkpoint.
  save_every_epoch: 1
  log_per_iter: 10
  ckpt_num: 1
  clip_grad: 3.0
  empty_cache: False
  dist_url: tcp://localhost:10009

DATA:
  train:
    name: partnete
    location: data/PartNetE
    meta_path: data/PartNetE/meta_info.json
    split: few_shot
    test_mode: False

    voxel_size: 0.01
    max_npt: 102400
    scale_factor: 3.4
    octree_bound: 0.999
    distort: True

    depth: 10
    full_depth: 2
    batch_size: 1
    shuffle: True
    pin_memory: False
    num_workers: 4

    # Retained for the shared O-CNN batch builder. PartNetE's actual
    # augmentations are implemented by datasets/partnete.py.
    angle: (0, 0, 0)
    interval: (1, 1, 1)
    scale: 0.0
    uniform: False
    jitter: 0.0
    flip: (0.0, 0.0, 0.0)
    orient_normal: ''

  test:
    name: partnete
    location: data/PartNetE
    meta_path: data/PartNetE/meta_info.json
    split: test
    test_mode: True

    voxel_size: 0.01
    fragment_max_npt: 102400
    scale_factor: 3.4
    octree_bound: 0.999
    distort: False

    # Periodic validation and ordinary SOLVER.run test stay single-pass. The
    # flag is activated only after selecting best_model.pth or by test_tta.
    tta: True

    depth: 10
    full_depth: 2
    batch_size: 1
    shuffle: False
    pin_memory: False
    num_workers: 0

    angle: (0, 0, 0)
    interval: (1, 1, 1)
    scale: 0.0
    uniform: False
    jitter: 0.0
    flip: (0.0, 0.0, 0.0)
    orient_normal: ''

MODEL:
  name: pointmamba_seg
  # N: normal (3), F: RGB (3), P: octree position (3).
  feature: NFP
  channel: 9
  nout: 148
  nempty: True
  interp: nearest
  sync_bn: True
  find_unused_parameters: False

LOSS:
  mask: -1
  num_class: 148
  ce_weight: 1.0
  lovasz_weight: 1.0
