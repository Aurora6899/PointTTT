# ShapeNet55-34 supervised classification with paper-aligned PointTTT/ASR.

SOLVER:
  gpu: 0,
  run: train
  type: adamw
  best_val: max:accu
  logdir: logs/shapenet55/paper
  rand_seed: 42
  max_epoch: 300
  test_every_epoch: 1
  log_per_iter: 20
  lr: 0.0001
  lr_type: step
  weight_decay: 0.05
  milestones: (120,160)
  ckpt_num: 20

DATA:
  train:
    name: shapenet55
    split: train
    point_root: data/ShapeNet55-34/shapenet_pc
    filelist: data/ShapeNet55-34/ShapeNet-55/train.txt
    num_classes: 55
    num_points: 1024
    sampling: random
    normalize: True
    depth: 6
    full_depth: 2
    orient_normal: ''
    distort: True
    angle: (0, 0, 0)
    interval: (1, 1, 1)
    scale: 0.25
    uniform: False
    jitter: 0.1
    flip: (0.0, 0.0, 0.0)
    batch_size: 32
    shuffle: True
    pin_memory: False
    num_workers: 4

  test:
    name: shapenet55
    split: test
    point_root: data/ShapeNet55-34/shapenet_pc
    filelist: data/ShapeNet55-34/ShapeNet-55/test.txt
    num_classes: 55
    num_points: 1024
    sampling: random
    normalize: True
    depth: 6
    full_depth: 2
    orient_normal: ''
    distort: False
    angle: (0, 0, 0)
    interval: (1, 1, 1)
    scale: 0.0
    uniform: False
    jitter: 0.0
    flip: (0.0, 0.0, 0.0)
    batch_size: 32
    shuffle: False
    pin_memory: False
    num_workers: 2

MODEL:
  name: pointttt_cls
  nout: 55
  channel: 3
  nempty: True
  feature: P
  partition_by_batch: True
  ttt_base_lr: 1.0
  ttt_update_train: True
  ttt_update_test: True
  ttt_layer_type: linear
  ttt_share_directions: False
  ttt_direction_mode: bidirectional
  ttt_fusion_mode: gated
  serialization_enabled: True
  serialization_aux_weight: 0.1
  serialization_target_temperature: 0.25
  serialization_explore_temperature: 1.0
  serialization_performance_weight: 1.0

LOSS:
  num_class: 55
